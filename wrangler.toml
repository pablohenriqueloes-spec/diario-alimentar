name = "diario-alimentar"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "diario-alimentar"
database_id = "71077e5c-b54a-443e-888a-08220988e06c"

[ai]
binding = "AI"

# A cada minuto: lembretes de notificação. Segunda às 9h UTC: nota de saúde dos alimentos novos.
[triggers]
crons = ["* * * * *", "0 9 * * 1"]
